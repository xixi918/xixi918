<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="汐汐学习工作台">
<title>🌻 汐汐学习工作台</title>
<style>/* ===== 汐汐学习工作台 · 浅蓝柔和风 ===== */
:root{
  --blue1:#e3f2fd; --blue2:#bbdefb; --blue3:#90caf9; --blue4:#64b5f6; --blue5:#42a5f5;
  --blue6:#2196f3; --blue7:#1976d2; --blue8:#1565c0;
  --ink:#1a237e; --ink2:#3949ab; --gray:#78909c;
  --orange:#ff9800; --orange-d:#f57c00;
  --green:#66bb6a; --green-d:#43a047;
  --red:#ef5350; --pink:#ec407a; --purple:#ab47bc; --yellow:#ffd54f;
  --card:#ffffff; --bg:#e3f2fd;
  --radius:16px; --radius-s:10px;
  --shadow:0 4px 16px rgba(33,150,243,.12);
  --sidebar-w:88px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",system-ui,sans-serif;
  color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
body{display:flex;min-height:100vh}

/* ===== 侧边栏 ===== */
.sidebar{width:var(--sidebar-w);background:linear-gradient(180deg,#bbdefb 0%,#90caf9 100%);
  position:fixed;left:0;top:0;bottom:0;z-index:100;display:flex;flex-direction:column;
  align-items:center;padding:10px 0;gap:4px;overflow-y:auto;box-shadow:2px 0 12px rgba(33,150,243,.15)}
.sidebar::-webkit-scrollbar{width:0}
.nav-item{width:72px;padding:8px 4px;border-radius:var(--radius-s);text-align:center;cursor:pointer;
  transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink)}
.nav-item .ico{font-size:22px;line-height:1}
.nav-item .lbl{font-size:10px;font-weight:600;line-height:1.2}
.nav-item:hover{background:rgba(255,255,255,.5)}
.nav-item.active{background:var(--blue6);color:#fff;box-shadow:0 3px 8px rgba(33,150,243,.4)}

/* ===== 主区域 ===== */
.main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-width:0}

/* 顶部导航 */
.topbar{background:#fff;display:flex;align-items:center;padding:10px 16px;position:sticky;top:0;z-index:50;
  box-shadow:0 2px 8px rgba(33,150,243,.1);gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.topbar::-webkit-scrollbar{height:0}
.topbar .brand{font-size:18px;font-weight:800;color:var(--blue7);display:flex;align-items:center;gap:6px;white-space:nowrap}
.topbar .brand .sun{font-size:24px}
.topbar .spacer{flex:1}
.top-tab{padding:8px 16px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;
  border:2px solid var(--blue2);background:#fff;color:var(--blue7);transition:all .2s;white-space:nowrap}
.top-tab:hover{background:var(--blue1)}
.top-tab.active{background:var(--blue6);color:#fff;border-color:var(--blue6)}

/* 内容区 */
.content{padding:14px;max-width:1100px;width:100%;margin:0 auto;flex:1}

/* 通用卡片 */
.card{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);margin-bottom:14px}
.card-title{font-size:17px;font-weight:800;color:var(--blue7);margin:0 0 10px;display:flex;align-items:center;gap:6px}

/* 标签条 */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{height:4px}
.tabs::-webkit-scrollbar-thumb{background:var(--blue3);border-radius:2px}
.tab{padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;
  background:var(--blue1);color:var(--blue7);white-space:nowrap;border:2px solid transparent;transition:all .15s}
.tab:hover{background:var(--blue2)}
.tab.active{background:var(--blue6);color:#fff;border-color:var(--blue6);box-shadow:0 2px 6px rgba(33,150,243,.3)}

/* ===== 识字卡片 ===== */
.char-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.char-card{background:linear-gradient(135deg,#fff 0%,#e3f2fd 100%);border-radius:var(--radius);
  padding:14px 8px;text-align:center;border:2px solid var(--blue2);cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.char-card:hover{transform:translateY(-3px);border-color:var(--blue5);box-shadow:0 6px 16px rgba(33,150,243,.2)}
.char-card .emoji{font-size:30px;line-height:1.2}
.char-card .hanzi{font-size:42px;font-weight:800;color:var(--blue8);line-height:1.1;margin:4px 0}
.char-card .pinyin{font-size:15px;color:var(--blue6);font-weight:600}
.char-card .word{font-size:12px;color:var(--gray);margin-top:4px}
.char-card.learned{background:linear-gradient(135deg,#e8f5e9 0%,#c8e6c9 100%);border-color:var(--green)}
.char-card.learned .hanzi{color:var(--green-d)}
.char-card .check{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;
  background:var(--green);color:#fff;font-size:12px;display:none;align-items:center;justify-content:center}
.char-card.learned .check{display:flex}

/* ===== 古诗卡片 ===== */
.poem-card{background:linear-gradient(135deg,#fffef7 0%,#fff8e1 100%);border:2px solid #ffe082;border-radius:var(--radius);padding:18px}
.poem-head{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.poem-title{font-size:22px;font-weight:800;color:#e65100}
.poem-author{font-size:13px;color:var(--gray)}
.diff-tag{padding:2px 10px;border-radius:999px;font-size:11px;font-weight:700;color:#fff}
.diff-1{background:var(--green)}.diff-2{background:var(--orange)}.diff-3{background:var(--red)}
.poem-content{font-size:20px;line-height:2;color:var(--ink);text-align:center;font-weight:600;
  font-family:"STKaiti","KaiTi",serif;white-space:pre-line;margin:14px 0}
.poem-explain{background:rgba(255,255,255,.6);border-radius:var(--radius-s);padding:12px;
  font-size:14px;line-height:1.8;color:#5d4037;border-left:4px solid var(--orange)}
.btn-speak{background:var(--orange);color:#fff;border:none;border-radius:999px;padding:8px 18px;
  font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:4px;margin-top:12px}
.btn-speak:hover{background:var(--orange-d)}
.btn-speak:disabled{opacity:.5}

/* ===== 绘本 ===== */
.book-recommend{background:linear-gradient(135deg,#e3f2fd 0%,#bbdefb 100%);border-radius:var(--radius);
  padding:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.book-recommend .cover{width:90px;height:90px;border-radius:12px;background:#fff;display:flex;
  align-items:center;justify-content:center;font-size:50px;flex-shrink:0;box-shadow:var(--shadow)}
.book-recommend .info{flex:1;min-width:180px}
.book-recommend .info h3{margin:0 0 4px;font-size:18px;color:var(--blue7)}
.book-recommend .info .author{font-size:13px;color:var(--gray);margin-bottom:6px}
.book-recommend .info .desc{font-size:13px;line-height:1.6;color:var(--ink2)}
.btn-read{background:var(--orange);color:#fff;border:none;border-radius:999px;padding:8px 20px;
  font-size:14px;font-weight:700;cursor:pointer}
.btn-read:hover{background:var(--orange-d)}
.book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px}
.book-item{background:#fff;border-radius:var(--radius);padding:10px;text-align:center;cursor:pointer;
  border:2px solid transparent;transition:all .2s}
.book-item:hover{border-color:var(--blue4);transform:translateY(-2px)}
.book-item .cover{width:100%;aspect-ratio:1;border-radius:10px;background:var(--blue1);display:flex;
  align-items:center;justify-content:center;font-size:42px;margin-bottom:6px}
.book-item .name{font-size:13px;font-weight:600;color:var(--ink);line-height:1.3}

/* ===== 拼音/英语 卡片 ===== */
.pinyin-grid,.eng-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.pinyin-card{background:linear-gradient(135deg,#fff 0%,#f3e5f5 100%);border:2px solid #ce93d8;border-radius:var(--radius);
  padding:14px 8px;text-align:center;cursor:pointer;transition:all .2s}
.pinyin-card:hover{transform:translateY(-3px);border-color:#ab47bc;box-shadow:0 6px 14px rgba(156,39,176,.15)}
.pinyin-card .py{font-size:36px;font-weight:800;color:#6a1b9a;line-height:1.1}
.pinyin-card .emo{font-size:24px;margin:4px 0}
.pinyin-card .ex{font-size:14px;color:var(--gray)}
.eng-card{background:linear-gradient(135deg,#fff 0%,#e8f5e9 100%);border:2px solid #a5d6a7;border-radius:var(--radius);
  padding:12px 8px;text-align:center;cursor:pointer;transition:all .2s}
.eng-card:hover{transform:translateY(-3px);border-color:var(--green);box-shadow:0 6px 14px rgba(76,175,80,.15)}
.eng-card .emo{font-size:32px;line-height:1.2}
.eng-card .word{font-size:16px;font-weight:800;color:#2e7d32;margin:4px 0 2px}
.eng-card .cn{font-size:13px;color:var(--gray)}
.eng-card .speak{background:var(--green);color:#fff;border:none;border-radius:999px;padding:4px 12px;
  font-size:12px;font-weight:600;cursor:pointer;margin-top:6px;display:inline-flex;align-items:center;gap:2px}
.eng-card .speak:hover{background:var(--green-d)}

/* ===== 算术 ===== */
.math-stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.math-stat{flex:1;min-width:70px;background:var(--blue1);border-radius:var(--radius-s);padding:10px;text-align:center}
.math-stat .v{font-size:22px;font-weight:800;color:var(--blue7)}
.math-stat .l{font-size:11px;color:var(--gray)}
.math-area{background:linear-gradient(135deg,#e3f2fd 0%,#bbdefb 100%);border-radius:var(--radius);padding:30px 16px;text-align:center}
.math-q{font-size:48px;font-weight:800;color:var(--blue8);margin-bottom:24px;font-family:Arial}
.math-opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:360px;margin:0 auto}
.math-opt{background:#fff;border:3px solid var(--blue3);border-radius:var(--radius);padding:16px;
  font-size:28px;font-weight:800;color:var(--blue7);cursor:pointer;transition:all .15s}
.math-opt:hover{border-color:var(--blue6);background:var(--blue1)}
.math-opt.correct{background:var(--green);border-color:var(--green);color:#fff}
.math-opt.wrong{background:var(--red);border-color:var(--red);color:#fff;animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ===== 思维游戏 ===== */
.mind-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.mind-card{background:linear-gradient(135deg,#fff 0%,#e3f2fd 100%);border:2px solid var(--blue3);
  border-radius:var(--radius);padding:18px 12px;text-align:center;cursor:pointer;transition:all .2s}
.mind-card:hover{transform:translateY(-3px);border-color:var(--blue6);box-shadow:0 8px 18px rgba(33,150,243,.2)}
.mind-card .ico{font-size:40px}
.mind-card .name{font-size:15px;font-weight:700;color:var(--blue7);margin-top:8px}
.mind-card .desc{font-size:12px;color:var(--gray);margin-top:4px;line-height:1.4}

/* 思维游戏弹层 */
.game-modal{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:none;
  align-items:center;justify-content:center;padding:16px}
.game-modal.show{display:flex}
.game-box{background:#fff;border-radius:var(--radius);padding:18px;max-width:480px;width:100%;
  max-height:85vh;overflow-y:auto;position:relative}
.game-box h3{margin:0 0 12px;color:var(--blue7);font-size:18px}
.game-close{position:absolute;top:8px;right:12px;font-size:24px;cursor:pointer;color:var(--gray);background:none;border:none}
.mem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mem-card{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:30px;cursor:pointer;background:var(--blue3);color:transparent;transition:all .3s;user-select:none}
.mem-card.flip{background:#fff;color:inherit;border:2px solid var(--blue5)}
.mem-card.matched{background:var(--green);color:#fff;border-color:var(--green)}
.seq-board{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:14px}
.seq-num{width:60px;height:60px;border-radius:12px;background:var(--blue4);color:#fff;display:flex;
  align-items:center;justify-content:center;font-size:24px;font-weight:800;cursor:pointer}
.seq-num.done{background:var(--green);opacity:.5}
.seq-num.err{background:var(--red);animation:shake .4s}

/* ===== 今日任务 ===== */
.task-list{display:flex;flex-direction:column;gap:10px}
.task-row{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--blue2);
  border-radius:var(--radius-s);padding:12px}
.task-row.done{background:#e8f5e9;border-color:var(--green)}
.task-check{width:26px;height:26px;border-radius:8px;border:2px solid var(--blue4);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;flex-shrink:0;transition:all .2s}
.task-check.on{background:var(--green);border-color:var(--green)}
.task-info{flex:1}
.task-info .name{font-size:15px;font-weight:600;color:var(--ink)}
.task-info .pts{font-size:13px;color:var(--orange-d);font-weight:700}
.sun-total{background:linear-gradient(135deg,#fffde7 0%,#fff9c4 100%);border:2px solid var(--yellow);
  border-radius:var(--radius);padding:16px;text-align:center;margin-bottom:14px}
.sun-total .num{font-size:42px;font-weight:800;color:var(--orange-d)}
.sun-total .lbl{font-size:13px;color:var(--gray)}

/* ===== 奖励成就 ===== */
.trophy{background:linear-gradient(135deg,#fff8e1 0%,#ffecb3 100%);border:2px solid var(--yellow);
  border-radius:var(--radius);padding:18px;text-align:center;margin-bottom:14px}
.trophy .ico{font-size:48px}
.trophy .pts{font-size:32px;font-weight:800;color:var(--orange-d);margin:6px 0}
.trophy .tip{font-size:13px;color:var(--gray)}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ach-card{background:#fff;border:2px solid var(--blue2);border-radius:var(--radius);padding:14px;text-align:center;position:relative}
.ach-card.unlocked{background:linear-gradient(135deg,#e8f5e9 0%,#c8e6c9 100%);border-color:var(--green)}
.ach-card .ico{font-size:36px;filter:grayscale(1);opacity:.5}
.ach-card.unlocked .ico{filter:none;opacity:1}
.ach-card .name{font-size:13px;font-weight:700;color:var(--ink);margin-top:6px;line-height:1.3}
.ach-card .desc{font-size:11px;color:var(--gray);margin-top:2px}
.ach-card .badge{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;
  background:var(--gray);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}
.ach-card.unlocked .badge{background:var(--green)}

/* ===== 日历 ===== */
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cal-head .ym{font-size:17px;font-weight:800;color:var(--blue7)}
.cal-nav{background:var(--blue1);border:none;border-radius:8px;padding:6px 12px;cursor:pointer;color:var(--blue7);font-weight:700}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-week{text-align:center;font-size:12px;color:var(--gray);font-weight:700;padding:4px 0}
.cal-cell{aspect-ratio:1;background:var(--blue1);border-radius:8px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-size:14px;color:var(--ink);position:relative}
.cal-cell.empty{background:transparent}
.cal-cell.done{background:var(--green);color:#fff}
.cal-cell.done::after{content:'✓';position:absolute;bottom:2px;font-size:10px}
.cal-cell.today{background:var(--blue6);color:#fff;box-shadow:0 0 0 3px var(--yellow)}
.cal-stats{display:flex;gap:8px;margin-top:14px}
.cal-stat{flex:1;background:var(--blue1);border-radius:var(--radius-s);padding:10px;text-align:center}
.cal-stat .v{font-size:20px;font-weight:800;color:var(--blue7)}
.cal-stat .l{font-size:11px;color:var(--gray)}

/* ===== Toast ===== */
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(60px);
  background:var(--blue8);color:#fff;padding:10px 20px;border-radius:999px;font-size:14px;font-weight:600;
  opacity:0;transition:.3s;z-index:300;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== 浮动按钮（手机返回顶部） ===== */
.fab{position:fixed;right:16px;bottom:20px;width:44px;height:44px;border-radius:50%;background:var(--blue6);
  color:#fff;border:none;font-size:20px;cursor:pointer;box-shadow:0 4px 12px rgba(33,150,243,.4);z-index:90;display:none}

/* ===== 响应式 ===== */
@media(max-width:640px){
  :root{--sidebar-w:64px}
  .sidebar{width:64px}
  .nav-item{width:56px}
  .nav-item .ico{font-size:20px}
  .nav-item .lbl{font-size:9px}
  .content{padding:10px}
  .char-grid{grid-template-columns:repeat(2,1fr)}
  .char-card .hanzi{font-size:36px}
  .math-q{font-size:40px}
  .math-opt{font-size:24px;padding:12px}
  .topbar .brand{font-size:15px}
  .topbar .brand .sun{font-size:20px}
  .top-tab{padding:6px 12px;font-size:12px}
  .book-recommend .cover{width:70px;height:70px;font-size:38px}
  .poem-content{font-size:18px}
  .fab{display:block}
}

/* 隐藏滚动条但保留功能 */
.section{display:none}
.section.active{display:block;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* PWA 提示 */
.pwa-tip{position:fixed;bottom:0;left:0;right:0;background:var(--blue7);color:#fff;padding:10px 16px;
  font-size:13px;text-align:center;z-index:250;display:none}
.pwa-tip.show{display:block}
.pwa-tip button{background:#fff;color:var(--blue7);border:none;border-radius:6px;padding:4px 10px;margin-left:8px;font-weight:700;cursor:pointer}
</style>
</head>
<body>

<!-- 侧边栏 -->
<nav class="sidebar" id="sidebar"></nav>

<!-- 主区域 -->
<div class="main">
  <!-- 顶部导航 -->
  <header class="topbar">
    <div class="brand"><span class="sun">🌻</span>汐汐学习工作台</div>
    <div class="spacer"></div>
    <div class="top-tab active" data-jump="tasks">📋 今日学习</div>
    <div class="top-tab" data-jump="rewards">⭐ 我的收藏</div>
  </header>

  <!-- 内容区 -->
  <main class="content" id="content">
    <!-- 识字 -->
    <section class="section" id="sec-chars">
      <div class="card">
        <h2 class="card-title">📖 每日识字</h2>
        <div class="tabs" id="charTabs"></div>
        <div class="char-grid" id="charGrid"></div>
      </div>
    </section>

    <!-- 古诗 -->
    <section class="section" id="sec-poems">
      <div class="card">
        <h2 class="card-title">📜 每日古诗</h2>
        <div class="tabs" id="poemTabs"></div>
        <div id="poemBox"></div>
      </div>
    </section>

    <!-- 绘本 -->
    <section class="section" id="sec-books">
      <div class="card">
        <h2 class="card-title">📚 每日一读</h2>
        <div id="bookRecommend"></div>
      </div>
      <div class="card">
        <h2 class="card-title">📚 绘本馆</h2>
        <div class="tabs" id="bookTabs"></div>
        <div class="book-grid" id="bookGrid"></div>
      </div>
    </section>

    <!-- 拼音 -->
    <section class="section" id="sec-pinyin">
      <div class="card">
        <h2 class="card-title">🔤 拼音学习</h2>
        <div class="tabs" id="pinyinTabs"></div>
        <div class="pinyin-grid" id="pinyinGrid"></div>
      </div>
    </section>

    <!-- 英语 -->
    <section class="section" id="sec-english">
      <div class="card">
        <h2 class="card-title">🌍 英语启蒙</h2>
        <div class="tabs" id="engTabs"></div>
        <div class="eng-grid" id="engGrid"></div>
      </div>
    </section>

    <!-- 算术 -->
    <section class="section" id="sec-math">
      <div class="card">
        <h2 class="card-title">🔢 10以内加减法</h2>
        <div class="tabs" id="mathTabs">
          <div class="tab active" data-mt="mix">混合</div>

const POEMS = [{"day": 1, "title": "咏鹅", "author": "骆宾王", "dynasty": "唐", "difficulty": 1, "content": "鹅，鹅，鹅，\n曲项向天歌。\n白毛浮绿水，\n红掌拨清波。", "explain": "大白鹅啊大白鹅，弯曲着脖子向天空鸣叫。洁白的羽毛浮在绿绿的水面上，红红的脚掌拨动着清清的水波。"}, {"day": 2, "title": "春晓", "author": "孟浩然", "dynasty": "唐", "difficulty": 1, "content": "春眠不觉晓，\n处处闻啼鸟。\n夜来风雨声，\n花落知多少。", "explain": "春天睡觉不知不觉就天亮了，到处都能听到小鸟叽叽喳喳的叫声。昨天夜里又是风又是雨，不知道那些美丽的花儿被吹落了多少呀。"}, {"day": 3, "title": "静夜思", "author": "李白", "dynasty": "唐", "difficulty": 1, "content": "床前明月光，\n疑是地上霜。\n举头望明月，\n低头思故乡。", "explain": "床前洒满了明亮的月光，好像是地上结了一层白白的霜。抬起头看看天上的明月，低下头不禁想念起远方的家乡。"}, {"day": 4, "title": "悯农", "author": "李绅", "dynasty": "唐", "difficulty": 1, "content": "锄禾日当午，\n汗滴禾下土。\n谁知盘中餐，\n粒粒皆辛苦。", "explain": "农民伯伯在正午烈日下给禾苗松土除草，汗水一滴一滴落在泥土里。谁知道我们碗里的饭食，每一粒都是农民伯伯辛苦种出来的呀。"}, {"day": 5, "title": "登鹳雀楼", "author": "王之涣", "dynasty": "唐", "difficulty": 1, "content": "白日依山尽，\n黄河入海流。\n欲穷千里目，\n更上一层楼。", "explain": "太阳沿着远山慢慢落下去了，黄河水奔腾着流向大海。想要看到更远更远的风景，就要再往上爬一层楼。"}, {"day": 6, "title": "咏柳", "author": "贺知章", "dynasty": "唐", "difficulty": 1, "content": "碧玉妆成一树高，\n万条垂下绿丝绦。\n不知细叶谁裁出，\n二月春风似剪刀。", "explain": "高高的柳树好像用碧玉打扮过一样，千万条柳枝垂下来像绿色的丝带。不知道这细细的叶子是谁裁剪出来的？原来是二月的春风像剪刀一样剪出来的呀。"}, {"day": 7, "title": "望庐山瀑布", "author": "李白", "dynasty": "唐", "difficulty": 1, "content": "日照香炉生紫烟，\n遥看瀑布挂前川。\n飞流直下三千尺，\n疑是银河落九天。", "explain": "太阳照在香炉峰上，升起了紫色的烟雾。远远望去，瀑布像一块白布挂在山前。水流飞快地直冲下来好长好长，让人以为是天上的银河掉到了人间。"}, {"day": 8, "title": "绝句", "author": "杜甫", "dynasty": "唐", "difficulty": 1, "content": "两个黄鹂鸣翠柳，\n一行白鹭上青天。\n窗含西岭千秋雪，\n门泊东吴万里船。", "explain": "两只黄鹂鸟在翠绿的柳树上唱歌，一行白鹭鸟飞上了蓝蓝的天空。窗户里能看到西边山上千年不化的积雪，门前停着从远方驶来的船只。"}, {"day": 9, "title": "江雪", "author": "柳宗元", "dynasty": "唐", "difficulty": 1, "content": "千山鸟飞绝，\n万径人踪灭。\n孤舟蓑笠翁，\n独钓寒江雪。", "explain": "所有的山上都没有鸟儿飞了，所有的路上都没有人走的脚印了。只有一只小船上，坐着一个戴着斗笠披着蓑衣的老爷爷，一个人在寒冷的江雪中钓鱼。"}, {"day": 10, "title": "寻隐者不遇", "author": "贾岛", "dynasty": "唐", "difficulty": 1, "content": "松下问童子，\n言师采药去。\n只在此山中，\n云深不知处。", "explain": "我在松树下问小徒弟：你师父去哪里了？他说师父去采药了。师父就在这座山里，可是山上的云雾太浓了，不知道他到底在哪里。"}, {"day": 11, "title": "游子吟", "author": "孟郊", "dynasty": "唐", "difficulty": 2, "content": "慈母手中线，\n游子身上衣。\n临行密密缝，\n意恐迟迟归。\n谁言寸草心，\n报得三春晖。", "explain": "妈妈手里拿着针线，给要出远门的孩子缝衣服。临走时缝了一针又一针，怕孩子回來得太晚了。就像小草的嫩心，怎么能报答得了春天阳光般的母爱呢？"}, {"day": 12, "title": "赋得古原草送别", "author": "白居易", "dynasty": "唐", "difficulty": 2, "content": "离离原上草，\n一岁一枯荣。\n野火烧不尽，\n春风吹又生。\n远芳侵古道，\n晴翠接荒城。\n又送王孙去，\n萋萋满别情。", "explain": "原野上的草长得很茂盛，每年枯萎一次又繁茂一次。野火怎么烧也烧不完，春风一吹又长出来了。远处的草漫到了古老的道路上，阳光下绿油油的连着荒凉的城。今天又要送好朋友离开了，满心的不舍得。"}, {"day": 13, "title": "小池", "author": "杨万里", "dynasty": "宋", "difficulty": 1, "content": "泉眼无声惜细流，\n树阴照水爱晴柔。\n小荷才露尖尖角，\n早有蜻蜓立上头。", "explain": "泉水静静地流着，好像舍不得让水流走。树荫映在水中，好像很喜欢这晴天柔和的风光。小荷叶才露出尖尖的小角，蜻蜓就已经飞来停在上面了。"}, {"day": 14, "title": "池上", "author": "白居易", "dynasty": "唐", "difficulty": 1, "content": "小娃撑小艇，\n偷采白莲回。\n不解藏踪迹，\n浮萍一道开。", "explain": "一个小娃娃划着小船，偷偷地采了白莲花回来。他不知道要藏好自己的脚印，小船划过，水面上浮萍被分开了一条长长的路。"}, {"day": 15, "title": "鹿柴", "author": "王维", "dynasty": "唐", "difficulty": 1, "content": "空山不见人，\n但闻人语响。\n返景入深林，\n复照青苔上。", "explain": "空空的大山里看不见一个人影，只听到有人说话的声音。夕阳的余光照进了深深的树林里，又照在了绿绿的青苔上。"}, {"day": 16, "title": "送别", "author": "王维", "dynasty": "唐", "difficulty": 1, "content": "山中相送罢，\n日暮掩柴扉。\n春草明年绿，\n王孙归不归。", "explain": "在山中送走了好朋友，天黑了关上了柴门。明年的春天草还会再绿，可是好朋友你还会不会回来呢？"}, {"day": 17, "title": "相思", "author": "王维", "dynasty": "唐", "difficulty": 1, "content": "红豆生南国，\n春来发几枝。\n愿君多采撷，\n此物最相思。", "explain": "红豆生长在南方，春天来了会发出多少新枝条呢？希望你多采一些，因为红豆最能代表想念别人的心意。"}, {"day": 18, "title": "杂诗", "author": "王维", "dynasty": "唐", "difficulty": 1, "content": "君自故乡来，\n应知故乡事。\n来日绮窗前，\n寒梅著花未。", "explain": "你从我的家乡过来，应该知道家乡的事情吧。你来的时候，我那扇雕花窗前的梅花，有没有开花呢？"}, {"day": 19, "title": "八阵图", "author": "杜甫", "dynasty": "唐", "difficulty": 1, "content": "功盖三分国，\n名成八阵图。\n江流石不转，\n遗恨失吞吴。", "explain": "诸葛亮的功劳盖过了三国时代的所有人，他的名字也因为八阵图传扬开来。江水哗哗地流，八阵图的石头却不会转动，只留下没能吞并东吴的遗憾。"}, {"day": 20, "title": "竹里馆", "author": "王维", "dynasty": "唐", "difficulty": 1, "content": "独坐幽篁里，\n弹琴复长啸。\n深林人不知，\n明月来相照。", "explain": "一个人坐在幽深的竹林里，弹着琴又放声歌唱。深深的树林里没有人知道我在这里，只有明月来陪伴我、照耀我。"}, {"day": 21, "title": "鸟鸣涧", "author": "王维", "dynasty": "唐", "difficulty": 1, "content": "人闲桂花落，\n夜静春山空。\n月出惊山鸟，\n时鸣春涧中。", "explain": "人安静下来的时候，能看到桂花轻轻飘落。夜里很静，春天的山里空空的。月亮升起来，惊动了山里的鸟儿，鸟儿时不时在春天的山涧里叫几声。"}, {"day": 22, "title": "山中送别", "author": "王维", "dynasty": "唐", "difficulty": 1, "content": "山中相送罢，\n日暮掩柴扉。\n春草明年绿，\n王孙归不归。", "explain": "在山里送走了好朋友，太阳下山了，轻轻关上柴门。明年春天草还会再变绿，不知道好朋友你还会不会回来呢？"}, {"day": 23, "title": "问刘十九", "author": "白居易", "dynasty": "唐", "difficulty": 1, "content": "绿蚁新醅酒，\n红泥小火炉。\n晚来天欲雪，\n能饮一杯无。", "explain": "新酿好的酒上浮着绿色的小泡泡，红泥做的小火炉烧得暖暖的。天晚了好像要下雪了，朋友，要不要来喝一杯呢？"}, {"day": 24, "title": "逢雪宿芙蓉山主人", "author": "刘长卿", "dynasty": "唐", "difficulty": 1, "content": "日暮苍山远，\n天寒白屋贫。\n柴门闻犬吠，\n风雪夜归人。", "explain": "太阳下山了，远处的山看上去灰蒙蒙的。天气好冷啊，这户人家的小屋简朴又清贫。柴门那边传来小狗汪汪叫，原来是有人在风雪天赶路回来了。"}, {"day": 25, "title": "江上渔者", "author": "范仲淹", "dynasty": "宋", "difficulty": 1, "content": "江上往来人，\n但爱鲈鱼美。\n君看一叶舟，\n出没风波里。", "explain": "江上来来往往的人，只知道鲈鱼好吃。你看看那只像树叶一样的小船，在风浪里一会儿出来一会儿不见，打鱼的人多危险呀。"}, {"day": 26, "title": "蚕妇", "author": "张俞", "dynasty": "宋", "difficulty": 1, "content": "昨日入城市，\n归来泪满巾。\n遍身罗绮者，\n不是养蚕人。", "explain": "昨天进城去卖丝绸，回来的时候眼泪湿透了手巾。因为看到全身上下穿着漂亮丝绸的人，并不是辛辛苦苦养蚕的人。"}, {"day": 27, "title": "陶者", "author": "梅尧臣", "dynasty": "宋", "difficulty": 1, "content": "陶尽门前土，\n屋上无片瓦。\n十指不沾泥，\n鳞鳞大厦居。", "explain": "烧瓦的人把门前的土都挖完了，自己家的屋顶上却连一片瓦都没有。那些十个手指头不沾一点泥的人，却住在瓦片像鱼鳞一样漂亮的大房子里。"}, {"day": 28, "title": "梅花", "author": "王安石", "dynasty": "宋", "difficulty": 1, "content": "墙角数枝梅，\n凌寒独自开。\n遥知不是雪，\n为有暗香来。", "explain": "墙角里有几枝梅花，在寒冷的冬天里自己悄悄地开了。远远望去好像不是雪，因为有淡淡的清香飘过来。"}, {"day": 29, "title": "画鸡", "author": "唐寅", "dynasty": "明", "difficulty": 1, "content": "头上红冠不用裁，\n满身雪白走将来。\n平生不敢轻言语，\n一叫千门万户开。", "explain": "头上红色的鸡冠不用剪裁，身上雪白的羽毛，大步走来。大公鸡平时不敢随便说话，可是它一叫起来，千家万户的门就都打开了。"}, {"day": 30, "title": "村居", "author": "高鼎", "dynasty": "清", "difficulty": 1, "content": "草长莺飞二月天，\n拂堤杨柳醉春烟。\n儿童散学归来早，\n忙趁东风放纸鸢。", "explain": "二月里草长长了，黄莺飞来飞去，柳枝轻轻拂着堤岸，春天的烟雾让人陶醉。小孩子们放学回来得早，赶紧趁着东风放起了风筝。"}, {"day": 31, "title": "所见", "author": "袁枚", "dynasty": "清", "difficulty": 1, "content": "牧童骑黄牛，\n歌声振林樾。\n意欲捕鸣蝉，\n忽然闭口立。", "explain": "一个放牛的小孩骑着黄牛，唱的歌在树林里回荡。他忽然想抓正在叫的知了，就赶紧闭上嘴巴，站在那里不动了。"}, {"day": 32, "title": "山行", "author": "杜牧", "dynasty": "唐", "difficulty": 1, "content": "远上寒山石径斜，\n白云生处有人家。\n停车坐爱枫林晚，\n霜叶红于二月花。", "explain": "弯弯曲曲的石头小路通向远远的秋山，白云升起的地方好像有人住。停下车来，是因为太喜欢傍晚的枫树林了，被霜打过的枫叶比二月的花还要红！"}, {"day": 33, "title": "清明", "author": "杜牧", "dynasty": "唐", "difficulty": 1, "content": "清明时节雨纷纷，\n路上行人欲断魂。\n借问酒家何处有，\n牧童遥指杏花村。", "explain": "清明节的时候下着纷纷细雨，路上的人伤心得好像丢了魂。问问哪里有卖酒的酒馆呀，放牛的小孩远远指着开满杏花的村子。"}, {"day": 34, "title": "江南春", "author": "杜牧", "dynasty": "唐", "difficulty": 2, "content": "千里莺啼绿映红，\n水村山郭酒旗风。\n南朝四百八十寺，\n多少楼台烟雨中。", "explain": "千里江南到处黄莺唱歌，绿叶映着红花。水边的村子、山脚的城墙边，酒店的旗子在风里飘。南朝留下了好多好多寺庙，无数的楼台都笼罩在蒙蒙的烟雨里。"}];

/* ---------- 语音 ---------- */
/* 语音：优先选高质量中文女声（iOS: Ting-Ting / Android: zh-CN 标准）*/
let _voices = [];
let _bestZhVoice = null;
function loadVoices(){
  _voices = speechSynthesis.getVoices() || [];
  // 优先级：Ting-Ting(iOS最标准普通话) > zh-CN 系列 > Google 普通话
  _bestZhVoice =
    _voices.find(v=>/Ting-Ting/i.test(v.name)) ||           // iOS 最标准
    _voices.find(v=>/Sinji|Mei-Jia/i.test(v.name)) ||        // 备选
    _voices.find(v=>/zh-CN/i.test(v.lang) && /female|女/i.test(v.name)) ||
    _voices.find(v=>/zh-CN/i.test(v.lang)) ||
    _voices.find(v=>/cmn-Hans/i.test(v.lang)) ||
    _voices.find(v=>/Google.*普通话|Google.*Mandarin/i.test(v.name)) ||
    _voices.find(v=>/zh/i.test(v.lang));
}
if('speechSynthesis' in window){
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}
function speak(text, lang){
  if(!('speechSynthesis' in window)){toast('浏览器不支持语音');return}
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang || 'zh-CN';
  // 中文用最标准的语音，英文用 en-US
  if(lang && lang.startsWith('en')){
    u.voice = _voices.find(v=>/Samantha/i.test(v.name)) || _voices.find(v=>/en-US/i.test(v.lang)) || null;
    u.rate = 0.85; u.pitch = 1.0;
  } else {
    if(_bestZhVoice) u.voice = _bestZhVoice;
    u.rate = 0.75;   // 稍慢，让幼儿听清
    u.pitch = 1.05;  // 略高，更亲切
  }
  u.volume = 1.0;
  speechSynthesis.speak(u);
}

function goSection(id){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  $('sec-'+id).classList.add('active');
  document.querySelectorAll('.nav-item').forEach((n,i)=>{
    n.classList.toggle('active', NAV[i].id===id);
  });
  // 顶部今日学习/收藏跳转
  document.querySelectorAll('.top-tab').forEach(t=>t.classList.remove('active'));
  if(id==='tasks') document.querySelector('.top-tab[data-jump="tasks"]').classList.add('active');
  if(id==='rewards') document.querySelector('.top-tab[data-jump="rewards"]').classList.add('active');
  location.hash = id;
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- 算术模块 ---------- */
let mathCur = null;
function genMath(){
  const type = S.mathType;
  let a,b,op,ans;
  if(type==='add'){op='+';a=rand(0,10);b=rand(0,10-a);ans=a+b}
  else if(type==='sub'){op='-';a=rand(0,10);b=rand(0,a);ans=a-b}
  else{if(Math.random()<.5){op='+';a=rand(0,10);b=rand(0,10-a);ans=a+b}else{op='-';a=rand(0,10);b=rand(0,a);ans=a-b}}
  // 生成4个选项
  const opts = new Set([ans]);
  while(opts.size<4){opts.add(rand(0,10))}
  const optArr = Array.from(opts).sort(()=>Math.random()-.5);
  mathCur = {a,b,op,ans,opts:optArr};
  renderMath();
}
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function renderMath(){
  $('mathQ').textContent = mathCur.a+' '+mathCur.op+' '+mathCur.b+' = ?';
  const box = $('mathOpts');
  box.innerHTML = '';
  mathCur.opts.forEach(o=>{
    const b = el('div','math-opt',o);
    b.onclick = ()=>answerMath(o,b);
    box.appendChild(b);
  });
  $('mathStats').innerHTML = `
    <div class="math-stat"><div class="v">${S.mathRight}</div><div class="l">✅ 答对</div></div>
    <div class="math-stat"><div class="v">${S.mathWrong}</div><div class="l">❌ 答错</div></div>
    <div class="math-stat"><div class="v">${S.mathRight+S.mathWrong>0?Math.round(S.mathRight/(S.mathRight+S.mathWrong)*100):0}%</div><div class="l">📊 正确率</div></div>
    <div class="math-stat"><div class="v">${S.mathStreak}</div><div class="l">🔥 连对</div></div>`;
}
function answerMath(opt,btn){
  if(btn.classList.contains('correct')||btn.classList.contains('wrong'))return;
  if(opt===mathCur.ans){
    btn.classList.add('correct');
    S.mathRight++; S.mathStreak++;
    toast('✅ 答对了！太棒了！');
  }else{
    btn.classList.add('wrong');
    // 标出正确答案
    document.querySelectorAll('.math-opt').forEach(b=>{if(parseInt(b.textContent)===mathCur.ans)b.classList.add('correct')});
    S.mathWrong++; S.mathStreak=0;
    toast('❌ 再想想，正确答案是 '+mathCur.ans);
  }
  save(); renderMath(); renderAch();
  checkLearnToday();
}
function nextMath(){genMath()}

/* 记忆翻牌 */
function gameMemory(){
  const area = $('gameArea');
  const emojis = ['🍎','🍌','🍇','🍓','🌟','🌸','🐶','🐱'];
  const cards = [...emojis,...emojis].sort(()=>Math.random()-.5);
  let flipped=[], matched=0;
  area.innerHTML = '<p style="text-align:center;color:#78909c;font-size:13px;margin:4px 0 12px">翻开两张相同的牌即可消除</p><div class="mem-grid" id="memGrid"></div>';
  const grid = $('memGrid');
  cards.forEach((e,i)=>{
    const c = el('div','mem-card',e);
    c.onclick = ()=>{
      if(c.classList.contains('flip')||c.classList.contains('matched'))return;
      c.classList.add('flip');
      flipped.push({i,e,el:c});
      if(flipped.length===2){
        const [a,b]=flipped; flipped=[];
        if(a.e===b.e){
          setTimeout(()=>{a.el.classList.add('matched');b.el.classList.add('matched');matched+=2;
            if(matched===cards.length){toast('🎉 全部找到了！');markMindPlayed('memory');setTimeout(closeGame,1200)}},300);
        }else{
          setTimeout(()=>{a.el.classList.remove('flip');b.el.classList.remove('flip')},800);
        }
      }
    };
    grid.appendChild(c);
  });
}
/* 数字顺序 */
function gameSequence(){
  const area = $('gameArea');
  const nums = [];
  while(nums.length<8){const n=rand(1,20);if(!nums.includes(n))nums.push(n)}
  nums.sort(()=>Math.random()-.5);
  let next = 1;
  const sorted = [...nums].sort((a,b)=>a-b);
  area.innerHTML = '<p style="text-align:center;color:#78909c;font-size:13px;margin:4px 0 12px">按从小到大顺序点击数字</p><div class="seq-board" id="seqBoard"></div>';
  const board = $('seqBoard');
  nums.forEach(n=>{
    const d = el('div','seq-num',n);
    d.onclick = ()=>{
      if(d.classList.contains('done'))return;
      if(n===sorted[next-1]){
        d.classList.add('done');next++;
        if(next>nums.length){toast('🎉 完成了！');markMindPlayed('sequence');setTimeout(closeGame,1200)}
      }else{d.classList.add('err');setTimeout(()=>d.classList.remove('err'),400)}
    };
    board.appendChild(d);
  });
}

/* ---------- 学习日历 ---------- */
function calMove(dir){
  S.calM += dir;
  if(S.calM<0){S.calM=11;S.calY--}
  if(S.calM>11){S.calM=0;S.calY++}
  save(); renderCalendar();
}
function renderCalendar(){
  const y=S.calY,m=S.calM;
  $('calYM').textContent = y+'年'+(m+1)+'月';
  const grid = $('calGrid');
  grid.innerHTML = '';
  ['日','一','二','三','四','五','六'].forEach(w=>grid.appendChild(el('div','cal-week',w)));
  const first = new Date(y,m,1).getDay();
  const days = new Date(y,m+1,0).getDate();
  for(let i=0;i<first;i++) grid.appendChild(el('div','cal-cell empty'));
  const today = todayStr();
  for(let d=1;d<=days;d++){
    const key = y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const done = S.learnDays.includes(key);
    const isToday = key===today;
    grid.appendChild(el('div','cal-cell'+(done?' done':'')+(isToday?' today':''),d));
  }
  // 统计本月
  const monthDays = S.learnDays.filter(d=>d.startsWith(y+'-'+String(m+1).padStart(2,'0'))).length;
  $('calStats').innerHTML = `
    <div class="cal-stat"><div class="v">${monthDays}</div><div class="l">📅 本月学习</div></div>
    <div class="cal-stat"><div class="v">${S.totalSun}</div><div class="l">☀️ 累计阳光</div></div>
    <div class="cal-stat"><div class="v">${ACHIEVEMENTS.filter(a=>a.check()).length}</div><div class="l">🎖️ 已解锁</div></div>`;
}
